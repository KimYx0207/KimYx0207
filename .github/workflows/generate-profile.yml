name: Generate Galaxy Profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config.yml"
      - "generator/**"

concurrency:
  group: profile-assets-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generate galaxy profile assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m generator.main

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- assets/generated/galaxy-header.svg assets/generated/stats-card.svg assets/generated/tech-stack.svg assets/generated/projects-constellation.svg
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update galaxy profile SVGs [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "::error::Could not push generated galaxy profile SVGs after 3 attempts"
          exit 1
