name: Generate Galaxy Profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config.yml"
      - "generator/**"

jobs:
  generate:
    name: Generate galaxy profile assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m generator.main

      - name: Generate light-mode SVGs
        run: |
          cd assets/generated
          for file in galaxy-header stats-card tech-stack projects-constellation; do
            sed -e 's/#0d1117/#faf5ff/g' \
                -e 's/#1a1040/#f5f3ff/g' \
                -e 's/#2d1b69/#ddd6fe/g' \
                -e 's/#e9d5ff/#1e1b4b/g' \
                -e 's/#c4b5fd/#4c1d95/g' \
                -e 's/#a78bfa/#6d28d9/g' \
                "${file}.svg" > "${file}-light.svg"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update galaxy profile SVGs [skip ci]"
            git push
          fi
